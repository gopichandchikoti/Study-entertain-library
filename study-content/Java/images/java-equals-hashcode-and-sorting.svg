<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Same or different? First or last?</title><desc id="desc">A HashSet uses hashCode to find the right drawer and equals to confirm a match, so the two must agree. A Comparator puts items in the order you choose.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2523">Same or different? First or last?</text><g font-family="sans-serif"><path d="M 295 195 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 195 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 195 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 1037.5 295 V 321 H 22 V 450 H 36" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 295 450 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 450 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 450 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="125" r="16" fill="#1e6b68"/><text x="70" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="96" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Two notes arrive</tspan></text><text x="58" y="185" font-size="17" fill="#3b4744"><tspan x="58" dy="0">Both say id 1 and title</tspan><tspan x="58" dy="22">Math.</tspan></text></g><g><rect x="330" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="125" r="16" fill="#1e6b68"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="386" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Compute hashCode</tspan></text><text x="348" y="185" font-size="17" fill="#3b4744"><tspan x="348" dy="0">Objects.hash(id, title)</tspan><tspan x="348" dy="22">gives the same number for</tspan><tspan x="348" dy="22">both.</tspan></text></g><g><rect x="620" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="125" r="16" fill="#1e6b68"/><text x="650" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="676" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Go to the drawer</tspan></text><text x="638" y="185" font-size="17" fill="#3b4744"><tspan x="638" dy="0">The set jumps to the</tspan><tspan x="638" dy="22">drawer for that number.</tspan></text></g><g><rect x="910" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="125" r="16" fill="#1e6b68"/><text x="940" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="966" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Ask equals</tspan></text><text x="928" y="185" font-size="17" fill="#3b4744"><tspan x="928" dy="0">Are they the same? Yes,</tspan><tspan x="928" dy="22">so the set keeps only</tspan><tspan x="928" dy="22">one.</tspan></text></g><g><rect x="40" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#b34f2e" stroke-width="3"/><circle cx="70" cy="380" r="16" fill="#b34f2e"/><text x="70" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="96" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">No equals</tspan><tspan x="96" dy="26">override</tspan></text><text x="58" y="466" font-size="17" fill="#3b4744"><tspan x="58" dy="0">Java thinks they are two</tspan><tspan x="58" dy="22">objects and keeps both.</tspan></text></g><g><rect x="330" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="380" r="16" fill="#1e6b68"/><text x="360" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="386" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Sort the list</tspan></text><text x="348" y="440" font-size="17" fill="#3b4744"><tspan x="348" dy="0">list.sort(...) needs a</tspan><tspan x="348" dy="22">rule for which comes</tspan><tspan x="348" dy="22">first.</tspan></text></g><g><rect x="620" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="380" r="16" fill="#1e6b68"/><text x="650" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">7</text><text x="676" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Write a</tspan><tspan x="676" dy="26">Comparator</tspan></text><text x="638" y="466" font-size="17" fill="#3b4744"><tspan x="638" dy="0"></tspan><tspan x="638" dy="22">Comparator.comparing(Note::title)</tspan><tspan x="638" dy="22">sorts by title.</tspan></text></g><g><rect x="910" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="380" r="16" fill="#1e6b68"/><text x="940" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">8</text><text x="966" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Records help</tspan></text><text x="928" y="440" font-size="17" fill="#3b4744"><tspan x="928" dy="0">A record has correct</tspan><tspan x="928" dy="22">equals and hashCode for</tspan><tspan x="928" dy="22">free.</tspan></text></g></g><text font-family="sans-serif" font-size="20" fill="#1d2523"><tspan x="40" y="625">A HashSet uses hashCode to find the right drawer and equals to confirm a match, so the two must agree. A Comparator puts</tspan><tspan x="40" y="653">items in the order you choose.</tspan></text></svg>
