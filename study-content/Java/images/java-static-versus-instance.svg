<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Shared by the school, owned by the student</title><desc id="desc">Static things belong to the class and are shared by every object. Instance things belong to one object. final means a value is set once and never changed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2523">Shared by the school, owned by the student</text><g font-family="sans-serif"><path d="M 295 195 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 195 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 195 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 1037.5 295 V 321 H 22 V 450 H 36" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 295 450 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 450 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 450 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="125" r="16" fill="#1e6b68"/><text x="70" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="96" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">The class</tspan></text><text x="58" y="185" font-size="17" fill="#3b4744"><tspan x="58" dy="0">class Student is the</tspan><tspan x="58" dy="22">blueprint.</tspan></text></g><g><rect x="330" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="125" r="16" fill="#1e6b68"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="386" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Static: one</tspan><tspan x="386" dy="26">shared copy</tspan></text><text x="348" y="211" font-size="17" fill="#3b4744"><tspan x="348" dy="0">static int count counts</tspan><tspan x="348" dy="22">every Student ever made.</tspan></text></g><g><rect x="620" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="125" r="16" fill="#1e6b68"/><text x="650" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="676" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Make object Ava</tspan></text><text x="638" y="185" font-size="17" fill="#3b4744"><tspan x="638" dy="0">new Student() creates one</tspan><tspan x="638" dy="22">student with their own</tspan><tspan x="638" dy="22">name.</tspan></text></g><g><rect x="910" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="125" r="16" fill="#1e6b68"/><text x="940" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="966" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Make object Ben</tspan></text><text x="928" y="185" font-size="17" fill="#3b4744"><tspan x="928" dy="0">Ben has a different name.</tspan><tspan x="928" dy="22">Changing Ava does not</tspan><tspan x="928" dy="22">change Ben.</tspan></text></g><g><rect x="40" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="380" r="16" fill="#1e6b68"/><text x="70" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="96" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Each constructor</tspan><tspan x="96" dy="26">adds 1</tspan></text><text x="58" y="466" font-size="17" fill="#3b4744"><tspan x="58" dy="0">count++ runs for each new</tspan><tspan x="58" dy="22">student, so count becomes</tspan><tspan x="58" dy="22">2.</tspan></text></g><g><rect x="330" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="380" r="16" fill="#1e6b68"/><text x="360" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="386" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Read it from the</tspan><tspan x="386" dy="26">class</tspan></text><text x="348" y="466" font-size="17" fill="#3b4744"><tspan x="348" dy="0">Student.count is 2, no</tspan><tspan x="348" dy="22">matter which student you</tspan><tspan x="348" dy="22">ask.</tspan></text></g><g><rect x="620" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="380" r="16" fill="#1e6b68"/><text x="650" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">7</text><text x="676" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">final means once</tspan></text><text x="638" y="440" font-size="17" fill="#3b4744"><tspan x="638" dy="0">static final int MAX =</tspan><tspan x="638" dy="22">80; is a constant that</tspan><tspan x="638" dy="22">cannot change.</tspan></text></g><g><rect x="910" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="380" r="16" fill="#1e6b68"/><text x="940" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">8</text><text x="966" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">this is the</tspan><tspan x="966" dy="26">current object</tspan></text><text x="928" y="466" font-size="17" fill="#3b4744"><tspan x="928" dy="0">this.name means the name</tspan><tspan x="928" dy="22">of the object we are</tspan><tspan x="928" dy="22">inside.</tspan></text></g></g><text font-family="sans-serif" font-size="20" fill="#1d2523"><tspan x="40" y="625">Static things belong to the class and are shared by every object. Instance things belong to one object. final means a</tspan><tspan x="40" y="653">value is set once and never changed.</tspan></text></svg>
