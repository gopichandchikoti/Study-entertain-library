<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Many things at once, and where data lives</title><desc id="desc">Threads let Java do several things at once. An executor is a team of workers with a size limit. The stack holds the current steps, and the heap holds the objects. Never let work or memory grow without a limit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2523">Many things at once, and where data lives</text><g font-family="sans-serif"><path d="M 295 195 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 195 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 195 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 1037.5 295 V 321 H 22 V 450 H 36" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 295 450 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="125" r="16" fill="#1e6b68"/><text x="70" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="96" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">A request arrives</tspan></text><text x="58" y="185" font-size="17" fill="#3b4744"><tspan x="58" dy="0">Someone asks the server</tspan><tspan x="58" dy="22">to do something.</tspan></text></g><g><rect x="330" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="125" r="16" fill="#1e6b68"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="386" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">The executor team</tspan></text><text x="348" y="185" font-size="17" fill="#3b4744"><tspan x="348" dy="0">A fixed number of worker</tspan><tspan x="348" dy="22">threads take turns.</tspan></text></g><g><rect x="620" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="125" r="16" fill="#1e6b68"/><text x="650" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="676" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">A task runs</tspan></text><text x="638" y="185" font-size="17" fill="#3b4744"><tspan x="638" dy="0">One worker runs your</tspan><tspan x="638" dy="22">task. The others handle</tspan><tspan x="638" dy="22">more tasks.</tspan></text></g><g><rect x="910" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#b34f2e" stroke-width="3"/><circle cx="940" cy="125" r="16" fill="#b34f2e"/><text x="940" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="966" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">The queue is</tspan><tspan x="966" dy="26">bounded</tspan></text><text x="928" y="211" font-size="17" fill="#3b4744"><tspan x="928" dy="0">If too many tasks arrive,</tspan><tspan x="928" dy="22">extra ones wait or are</tspan><tspan x="928" dy="22">refused.</tspan></text></g><g><rect x="40" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="380" r="16" fill="#1e6b68"/><text x="70" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="96" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Stack and heap</tspan></text><text x="58" y="440" font-size="17" fill="#3b4744"><tspan x="58" dy="0">Stack = the steps now.</tspan><tspan x="58" dy="22">Heap = the objects that</tspan><tspan x="58" dy="22">live longer.</tspan></text></g><g><rect x="330" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="380" r="16" fill="#1e6b68"/><text x="360" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="386" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Cancel or finish</tspan></text><text x="348" y="440" font-size="17" fill="#3b4744"><tspan x="348" dy="0">A task can be asked to</tspan><tspan x="348" dy="22">stop, and must clean up.</tspan></text></g></g><text font-family="sans-serif" font-size="20" fill="#1d2523"><tspan x="40" y="625">Threads let Java do several things at once. An executor is a team of workers with a size limit. The stack holds the</tspan><tspan x="40" y="653">current steps, and the heap holds the objects. Never let work or memory grow without a limit.</tspan></text></svg>
