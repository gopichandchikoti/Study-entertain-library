<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Blueprint, house, and locked doors</title><desc id="desc">A class is the blueprint. Every object you make with new is one real house. Private fields are locked rooms. Public methods are the doors you may use, so rules like 'never blank' always hold.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2523">Blueprint, house, and locked doors</text><g font-family="sans-serif"><path d="M 295 195 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 195 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 195 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 1037.5 295 V 321 H 22 V 450 H 36" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 295 450 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="125" r="16" fill="#1e6b68"/><text x="70" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="96" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">The class</tspan><tspan x="96" dy="26">(blueprint)</tspan></text><text x="58" y="211" font-size="17" fill="#3b4744"><tspan x="58" dy="0">class Note describes what</tspan><tspan x="58" dy="22">every note has and can</tspan><tspan x="58" dy="22">do.</tspan></text></g><g><rect x="330" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="125" r="16" fill="#1e6b68"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="386" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Make an object</tspan></text><text x="348" y="185" font-size="17" fill="#3b4744"><tspan x="348" dy="0">new Note(&quot;Math&quot;) builds</tspan><tspan x="348" dy="22">one real note from the</tspan><tspan x="348" dy="22">blueprint.</tspan></text></g><g><rect x="620" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="125" r="16" fill="#1e6b68"/><text x="650" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="676" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Private fields</tspan></text><text x="638" y="185" font-size="17" fill="#3b4744"><tspan x="638" dy="0">private String title;</tspan><tspan x="638" dy="22">stays inside. Others</tspan><tspan x="638" dy="22">cannot touch it directly.</tspan></text></g><g><rect x="910" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="125" r="16" fill="#1e6b68"/><text x="940" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="966" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Public methods</tspan></text><text x="928" y="185" font-size="17" fill="#3b4744"><tspan x="928" dy="0">rename(&quot;Science&quot;) is the</tspan><tspan x="928" dy="22">door that everyone may</tspan><tspan x="928" dy="22">use.</tspan></text></g><g><rect x="40" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="380" r="16" fill="#1e6b68"/><text x="70" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="96" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">The method checks</tspan><tspan x="96" dy="26">rules</tspan></text><text x="58" y="466" font-size="17" fill="#3b4744"><tspan x="58" dy="0">It refuses a blank title</tspan><tspan x="58" dy="22">before changing anything.</tspan></text></g><g><rect x="330" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="380" r="16" fill="#1e6b68"/><text x="360" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="386" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">The rule always</tspan><tspan x="386" dy="26">holds</tspan></text><text x="348" y="466" font-size="17" fill="#3b4744"><tspan x="348" dy="0">That rule is the</tspan><tspan x="348" dy="22">invariant. Every Note is</tspan><tspan x="348" dy="22">always valid.</tspan></text></g></g><text font-family="sans-serif" font-size="20" fill="#1d2523"><tspan x="40" y="625">A class is the blueprint. Every object you make with new is one real house. Private fields are locked rooms. Public</tspan><tspan x="40" y="653">methods are the doors you may use, so rules like 'never blank' always hold.</tspan></text></svg>
