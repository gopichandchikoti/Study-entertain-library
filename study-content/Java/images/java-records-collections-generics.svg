<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Little data cards and the shelves that hold them</title><desc id="desc">A record is a small, unchangeable data card. A List keeps cards in order, a Set keeps only one of each, and a Map finds a card by its label. Generics tell Java what is on the shelf, like List&lt;Note&gt;.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2523">Little data cards and the shelves that hold them</text><g font-family="sans-serif"><path d="M 295 195 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 195 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 195 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 1037.5 295 V 321 H 22 V 450 H 36" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 295 450 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="125" r="16" fill="#1e6b68"/><text x="70" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="96" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">A record = a data</tspan><tspan x="96" dy="26">card</tspan></text><text x="58" y="211" font-size="17" fill="#3b4744"><tspan x="58" dy="0">record Note(int id,</tspan><tspan x="58" dy="22">String title) holds data,</tspan><tspan x="58" dy="22">simply.</tspan></text></g><g><rect x="330" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="125" r="16" fill="#1e6b68"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="386" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">List of notes</tspan></text><text x="348" y="185" font-size="17" fill="#3b4744"><tspan x="348" dy="0">List&lt;Note&gt;: cards in</tspan><tspan x="348" dy="22">order. The same card can</tspan><tspan x="348" dy="22">appear twice.</tspan></text></g><g><rect x="620" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="125" r="16" fill="#1e6b68"/><text x="650" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="676" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Set of notes</tspan></text><text x="638" y="185" font-size="17" fill="#3b4744"><tspan x="638" dy="0">Set&lt;Note&gt;: no duplicates</tspan><tspan x="638" dy="22">allowed. Great for</tspan><tspan x="638" dy="22">'unique tags'.</tspan></text></g><g><rect x="910" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="125" r="16" fill="#1e6b68"/><text x="940" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="966" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Map by id</tspan></text><text x="928" y="185" font-size="17" fill="#3b4744"><tspan x="928" dy="0">Map&lt;Integer, Note&gt;: look</tspan><tspan x="928" dy="22">up a card by its id</tspan><tspan x="928" dy="22">quickly.</tspan></text></g><g><rect x="40" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="380" r="16" fill="#1e6b68"/><text x="70" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="96" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Generics: the</tspan><tspan x="96" dy="26">label</tspan></text><text x="58" y="466" font-size="17" fill="#3b4744"><tspan x="58" dy="0">The &lt;Note&gt; part promises</tspan><tspan x="58" dy="22">only Notes go in, so no</tspan><tspan x="58" dy="22">surprises come out.</tspan></text></g><g><rect x="330" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="380" r="16" fill="#1e6b68"/><text x="360" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="386" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Pick the right</tspan><tspan x="386" dy="26">shelf</tspan></text><text x="348" y="466" font-size="17" fill="#3b4744"><tspan x="348" dy="0">Order? List. Unique? Set.</tspan><tspan x="348" dy="22">Lookup by key? Map.</tspan></text></g></g><text font-family="sans-serif" font-size="20" fill="#1d2523"><tspan x="40" y="625">A record is a small, unchangeable data card. A List keeps cards in order, a Set keeps only one of each, and a Map finds</tspan><tspan x="40" y="653">a card by its label. Generics tell Java what is on the shelf, like List&lt;Note&gt;.</tspan></text></svg>
