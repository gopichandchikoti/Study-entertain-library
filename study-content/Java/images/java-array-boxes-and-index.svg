<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">An array is a row of numbered boxes</title><desc id="desc">The boxes are numbered from 0. The last box is length minus one. Asking for a number outside the row causes ArrayIndexOutOfBoundsException.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2523">An array is a row of numbered boxes</text><g font-family="sans-serif"><path d="M 295 195 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 195 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 195 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 1037.5 295 V 321 H 22 V 450 H 36" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 295 450 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 450 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 450 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="125" r="16" fill="#1e6b68"/><text x="70" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="96" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Make the array</tspan></text><text x="58" y="185" font-size="17" fill="#3b4744"><tspan x="58" dy="0">int[] scores = {5, 8, 3,</tspan><tspan x="58" dy="22">9, 1}; makes five boxes</tspan><tspan x="58" dy="22">in a row.</tspan></text></g><g><rect x="330" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="125" r="16" fill="#1e6b68"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="386" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Box 0 holds 5</tspan></text><text x="348" y="185" font-size="17" fill="#3b4744"><tspan x="348" dy="0">scores[0] is the first</tspan><tspan x="348" dy="22">box. Counting starts at</tspan><tspan x="348" dy="22">zero.</tspan></text></g><g><rect x="620" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="125" r="16" fill="#1e6b68"/><text x="650" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="676" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Box 2 holds 3</tspan></text><text x="638" y="185" font-size="17" fill="#3b4744"><tspan x="638" dy="0">scores[2] is the third</tspan><tspan x="638" dy="22">box. You can read it or</tspan><tspan x="638" dy="22">change it.</tspan></text></g><g><rect x="910" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="125" r="16" fill="#1e6b68"/><text x="940" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="966" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Box 4 holds 1</tspan></text><text x="928" y="185" font-size="17" fill="#3b4744"><tspan x="928" dy="0">scores[4] is the last</tspan><tspan x="928" dy="22">box, because length is 5</tspan><tspan x="928" dy="22">and 5 minus 1 is 4.</tspan></text></g><g><rect x="40" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="380" r="16" fill="#1e6b68"/><text x="70" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="96" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Walk with a loop</tspan></text><text x="58" y="440" font-size="17" fill="#3b4744"><tspan x="58" dy="0">for (int i = 0; i &lt;</tspan><tspan x="58" dy="22">scores.length; i++)</tspan><tspan x="58" dy="22">visits every box.</tspan></text></g><g><rect x="330" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="380" r="16" fill="#1e6b68"/><text x="360" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="386" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Or use for-each</tspan></text><text x="348" y="440" font-size="17" fill="#3b4744"><tspan x="348" dy="0">for (int s : scores)</tspan><tspan x="348" dy="22">visits each value without</tspan><tspan x="348" dy="22">an index.</tspan></text></g><g><rect x="620" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#b34f2e" stroke-width="3"/><circle cx="650" cy="380" r="16" fill="#b34f2e"/><text x="650" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">7</text><text x="676" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Box 5 does not</tspan><tspan x="676" dy="26">exist</tspan></text><text x="638" y="466" font-size="17" fill="#3b4744"><tspan x="638" dy="0">scores[5] crashes with</tspan><tspan x="638" dy="22">ArrayIndexOutOfBoundsException.</tspan></text></g><g><rect x="910" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="380" r="16" fill="#1e6b68"/><text x="940" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">8</text><text x="966" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Need to grow?</tspan></text><text x="928" y="440" font-size="17" fill="#3b4744"><tspan x="928" dy="0">Use an ArrayList. A plain</tspan><tspan x="928" dy="22">array has a fixed size.</tspan></text></g></g><text font-family="sans-serif" font-size="20" fill="#1d2523"><tspan x="40" y="625">The boxes are numbered from 0. The last box is length minus one. Asking for a number outside the row causes</tspan><tspan x="40" y="653">ArrayIndexOutOfBoundsException.</tspan></text></svg>
