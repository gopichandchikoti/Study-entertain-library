<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Mcp Stdio Transport</title><desc id="desc">host process, stdin, stdout message channel, and stderr logs</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="28" fill="#1d2523">Mcp Stdio Transport</text><g font-family="sans-serif"><path d="M 290 175 H 322" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 580 175 H 612" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 870 175 H 902" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="115" width="250" height="120" rx="10" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><text x="165" y="147" text-anchor="middle" font-size="21" fill="#1d2523"><tspan x="165" dy="0">host process</tspan></text></g><g><rect x="330" y="115" width="250" height="120" rx="10" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><text x="455" y="147" text-anchor="middle" font-size="21" fill="#1d2523"><tspan x="455" dy="0">stdin</tspan></text></g><g><rect x="620" y="115" width="250" height="120" rx="10" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><text x="745" y="147" text-anchor="middle" font-size="21" fill="#1d2523"><tspan x="745" dy="0">stdout message</tspan><tspan x="745" dy="26">channel</tspan></text></g><g><rect x="910" y="115" width="250" height="120" rx="10" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><text x="1035" y="147" text-anchor="middle" font-size="21" fill="#1d2523"><tspan x="1035" dy="0">stderr logs</tspan></text></g></g><text x="40" y="670" font-family="sans-serif" font-size="19" fill="#1d2523">Legend: teal = normal flow · coral = error or trust check · arrows = messages or decisions</text></svg>
