<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">From a click to an answer in FastAPI</title><desc id="desc">A browser sends a request over HTTP. An ASGI server hands it to FastAPI, which picks the right route. The route calls the service, the service uses the repository, and the answer returns as JSON.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2523">From a click to an answer in FastAPI</text><g font-family="sans-serif"><path d="M 295 195 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 195 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 195 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 1037.5 295 V 321 H 22 V 450 H 36" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 295 450 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 450 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 450 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="125" r="16" fill="#1e6b68"/><text x="70" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="96" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">The client asks</tspan></text><text x="58" y="185" font-size="17" fill="#3b4744"><tspan x="58" dy="0">A browser or app sends</tspan><tspan x="58" dy="22">GET /notes/1.</tspan></text></g><g><rect x="330" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="125" r="16" fill="#1e6b68"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="386" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">HTTP carries it</tspan></text><text x="348" y="185" font-size="17" fill="#3b4744"><tspan x="348" dy="0">The request travels as</tspan><tspan x="348" dy="22">method, path, headers,</tspan><tspan x="348" dy="22">and body.</tspan></text></g><g><rect x="620" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="125" r="16" fill="#1e6b68"/><text x="650" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="676" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">The ASGI server</tspan></text><text x="638" y="185" font-size="17" fill="#3b4744"><tspan x="638" dy="0">uvicorn receives it and</tspan><tspan x="638" dy="22">gives it to FastAPI.</tspan></text></g><g><rect x="910" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="125" r="16" fill="#1e6b68"/><text x="940" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="966" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">The route</tspan></text><text x="928" y="185" font-size="17" fill="#3b4744"><tspan x="928" dy="0">@app.get('/notes/{id}')</tspan><tspan x="928" dy="22">matches and runs your</tspan><tspan x="928" dy="22">function.</tspan></text></g><g><rect x="40" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="380" r="16" fill="#1e6b68"/><text x="70" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="96" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">The service</tspan></text><text x="58" y="440" font-size="17" fill="#3b4744"><tspan x="58" dy="0">Applies the rules: does</tspan><tspan x="58" dy="22">this note exist?</tspan></text></g><g><rect x="330" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="380" r="16" fill="#1e6b68"/><text x="360" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="386" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">The repository</tspan></text><text x="348" y="440" font-size="17" fill="#3b4744"><tspan x="348" dy="0">Reads the data from the</tspan><tspan x="348" dy="22">database.</tspan></text></g><g><rect x="620" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="380" r="16" fill="#1e6b68"/><text x="650" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">7</text><text x="676" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Build the</tspan><tspan x="676" dy="26">response</tspan></text><text x="638" y="466" font-size="17" fill="#3b4744"><tspan x="638" dy="0">FastAPI turns the Python</tspan><tspan x="638" dy="22">object into JSON.</tspan></text></g><g><rect x="910" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="380" r="16" fill="#1e6b68"/><text x="940" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">8</text><text x="966" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">The client gets</tspan><tspan x="966" dy="26">JSON</tspan></text><text x="928" y="466" font-size="17" fill="#3b4744"><tspan x="928" dy="0">Status 200 and the note's</tspan><tspan x="928" dy="22">data appear on screen.</tspan></text></g></g><text font-family="sans-serif" font-size="20" fill="#1d2523"><tspan x="40" y="625">A browser sends a request over HTTP. An ASGI server hands it to FastAPI, which picks the right route. The route calls</tspan><tspan x="40" y="653">the service, the service uses the repository, and the answer returns as JSON.</tspan></text></svg>
