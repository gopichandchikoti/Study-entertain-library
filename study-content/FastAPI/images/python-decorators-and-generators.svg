<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Wrapping paper and a vending machine</title><desc id="desc">A decorator wraps a function to add behavior. A generator uses yield to hand back one value at a time. FastAPI uses both: @app.get registers routes, and yield dependencies clean up.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2523">Wrapping paper and a vending machine</text><g font-family="sans-serif"><path d="M 295 195 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 195 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 195 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 1037.5 295 V 321 H 22 V 450 H 36" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 295 450 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 450 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 450 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="125" r="16" fill="#1e6b68"/><text x="70" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="96" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">A plain function</tspan></text><text x="58" y="185" font-size="17" fill="#3b4744"><tspan x="58" dy="0">def add(a, b): return a +</tspan><tspan x="58" dy="22">b</tspan></text></g><g><rect x="330" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="125" r="16" fill="#1e6b68"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="386" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Wrap it</tspan></text><text x="348" y="185" font-size="17" fill="#3b4744"><tspan x="348" dy="0">@loud above add means add</tspan><tspan x="348" dy="22">= loud(add).</tspan></text></g><g><rect x="620" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="125" r="16" fill="#1e6b68"/><text x="650" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="676" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">The wrapper runs</tspan></text><text x="638" y="185" font-size="17" fill="#3b4744"><tspan x="638" dy="0">It does something extra,</tspan><tspan x="638" dy="22">like printing, then calls</tspan><tspan x="638" dy="22">the real function.</tspan></text></g><g><rect x="910" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="125" r="16" fill="#1e6b68"/><text x="940" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="966" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0"></tspan><tspan x="966" dy="26">@app.get('/health')</tspan></text><text x="928" y="211" font-size="17" fill="#3b4744"><tspan x="928" dy="0">Registers the function as</tspan><tspan x="928" dy="22">the handler for GET</tspan><tspan x="928" dy="22">/health.</tspan></text></g><g><rect x="40" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="380" r="16" fill="#1e6b68"/><text x="70" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="96" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">A generator</tspan></text><text x="58" y="440" font-size="17" fill="#3b4744"><tspan x="58" dy="0">def count(): yield 1;</tspan><tspan x="58" dy="22">yield 2 hands back one</tspan><tspan x="58" dy="22">value at a time.</tspan></text></g><g><rect x="330" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="380" r="16" fill="#1e6b68"/><text x="360" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="386" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">yield pauses</tspan></text><text x="348" y="440" font-size="17" fill="#3b4744"><tspan x="348" dy="0">The function freezes at</tspan><tspan x="348" dy="22">yield and continues</tspan><tspan x="348" dy="22">later.</tspan></text></g><g><rect x="620" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#b34f2e" stroke-width="3"/><circle cx="650" cy="380" r="16" fill="#b34f2e"/><text x="650" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">7</text><text x="676" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Dependency with</tspan><tspan x="676" dy="26">yield</tspan></text><text x="638" y="466" font-size="17" fill="#3b4744"><tspan x="638" dy="0">Open the session, yield</tspan><tspan x="638" dy="22">it, then close it in</tspan><tspan x="638" dy="22">finally.</tspan></text></g><g><rect x="910" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="380" r="16" fill="#1e6b68"/><text x="940" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">8</text><text x="966" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Cleanup always</tspan><tspan x="966" dy="26">runs</tspan></text><text x="928" y="466" font-size="17" fill="#3b4744"><tspan x="928" dy="0">Even after an error, the</tspan><tspan x="928" dy="22">session is closed.</tspan></text></g></g><text font-family="sans-serif" font-size="20" fill="#1d2523"><tspan x="40" y="625">A decorator wraps a function to add behavior. A generator uses yield to hand back one value at a time. FastAPI uses</tspan><tspan x="40" y="653">both: @app.get registers routes, and yield dependencies clean up.</tspan></text></svg>
