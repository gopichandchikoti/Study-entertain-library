<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">FastAPI checks the input before your code runs</title><desc id="desc">FastAPI reads the type hints on your function and checks the incoming data. If it does not match, FastAPI answers with a helpful error and your function is never called.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2523">FastAPI checks the input before your code runs</text><g font-family="sans-serif"><path d="M 295 195 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 195 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 195 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 1037.5 295 V 321 H 22 V 450 H 36" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 295 450 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 450 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="125" r="16" fill="#1e6b68"/><text x="70" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="96" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">A request comes</tspan><tspan x="96" dy="26">in</tspan></text><text x="58" y="211" font-size="17" fill="#3b4744"><tspan x="58" dy="0">It carries parts: path,</tspan><tspan x="58" dy="22">query, and a JSON body.</tspan></text></g><g><rect x="330" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="125" r="16" fill="#1e6b68"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="386" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">FastAPI reads</tspan><tspan x="386" dy="26">your hints</tspan></text><text x="348" y="211" font-size="17" fill="#3b4744"><tspan x="348" dy="0">def create(note: NoteIn)</tspan><tspan x="348" dy="22">tells FastAPI what to</tspan><tspan x="348" dy="22">expect.</tspan></text></g><g><rect x="620" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="125" r="16" fill="#1e6b68"/><text x="650" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="676" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Check the data</tspan></text><text x="638" y="185" font-size="17" fill="#3b4744"><tspan x="638" dy="0">Pydantic checks each</tspan><tspan x="638" dy="22">field: type, length,</tspan><tspan x="638" dy="22">required.</tspan></text></g><g><rect x="910" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#b34f2e" stroke-width="3"/><circle cx="940" cy="125" r="16" fill="#b34f2e"/><text x="940" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="966" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Data is wrong</tspan></text><text x="928" y="185" font-size="17" fill="#3b4744"><tspan x="928" dy="0">FastAPI returns 422 with</tspan><tspan x="928" dy="22">a clear explanation. Your</tspan><tspan x="928" dy="22">code is skipped.</tspan></text></g><g><rect x="40" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="380" r="16" fill="#1e6b68"/><text x="70" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="96" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Data is good</tspan></text><text x="58" y="440" font-size="17" fill="#3b4744"><tspan x="58" dy="0">Your function receives a</tspan><tspan x="58" dy="22">clean, typed NoteIn</tspan><tspan x="58" dy="22">object.</tspan></text></g><g><rect x="330" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="380" r="16" fill="#1e6b68"/><text x="360" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="386" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Your route runs</tspan></text><text x="348" y="440" font-size="17" fill="#3b4744"><tspan x="348" dy="0">You focus on the real</tspan><tspan x="348" dy="22">work, not on parsing.</tspan></text></g><g><rect x="620" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="380" r="16" fill="#1e6b68"/><text x="650" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">7</text><text x="676" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Response model</tspan></text><text x="638" y="440" font-size="17" fill="#3b4744"><tspan x="638" dy="0">The answer is filtered to</tspan><tspan x="638" dy="22">only the fields you</tspan><tspan x="638" dy="22">promised.</tspan></text></g></g><text font-family="sans-serif" font-size="20" fill="#1d2523"><tspan x="40" y="625">FastAPI reads the type hints on your function and checks the incoming data. If it does not match, FastAPI answers with a</tspan><tspan x="40" y="653">helpful error and your function is never called.</tspan></text></svg>
