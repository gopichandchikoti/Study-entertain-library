<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Reading a Python error from the bottom up</title><desc id="desc">The last line tells you what went wrong. The lines above show the path the program walked. Find the line from your own file, fix one thing, and run again.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2523">Reading a Python error from the bottom up</text><g font-family="sans-serif"><path d="M 295 195 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 195 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 195 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 1037.5 295 V 321 H 22 V 450 H 36" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 295 450 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 450 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 450 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#b34f2e" stroke-width="3"/><circle cx="70" cy="125" r="16" fill="#b34f2e"/><text x="70" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="96" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">The program</tspan><tspan x="96" dy="26">crashes</tspan></text><text x="58" y="211" font-size="17" fill="#3b4744"><tspan x="58" dy="0">Red text appears. This is</tspan><tspan x="58" dy="22">a clue, not a punishment.</tspan></text></g><g><rect x="330" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="125" r="16" fill="#1e6b68"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="386" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Read the LAST</tspan><tspan x="386" dy="26">line</tspan></text><text x="348" y="211" font-size="17" fill="#3b4744"><tspan x="348" dy="0">It names the error type,</tspan><tspan x="348" dy="22">like TypeError, and gives</tspan><tspan x="348" dy="22">a message.</tspan></text></g><g><rect x="620" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="125" r="16" fill="#1e6b68"/><text x="650" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="676" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Find the nearest</tspan><tspan x="676" dy="26">line of yours</tspan></text><text x="638" y="211" font-size="17" fill="#3b4744"><tspan x="638" dy="0">Look for 'File app.py,</tspan><tspan x="638" dy="22">line 5'. That is your</tspan><tspan x="638" dy="22">code.</tspan></text></g><g><rect x="910" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="125" r="16" fill="#1e6b68"/><text x="940" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="966" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Open that line</tspan></text><text x="928" y="185" font-size="17" fill="#3b4744"><tspan x="928" dy="0">Look at the exact spot</tspan><tspan x="928" dy="22">and the values involved.</tspan></text></g><g><rect x="40" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="380" r="16" fill="#1e6b68"/><text x="70" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="96" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Print or use the</tspan><tspan x="96" dy="26">debugger</tspan></text><text x="58" y="466" font-size="17" fill="#3b4744"><tspan x="58" dy="0">print(total) shows what</tspan><tspan x="58" dy="22">the value really is.</tspan></text></g><g><rect x="330" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="380" r="16" fill="#1e6b68"/><text x="360" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="386" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Guess the cause</tspan></text><text x="348" y="440" font-size="17" fill="#3b4744"><tspan x="348" dy="0">Number plus text? Missing</tspan><tspan x="348" dy="22">key? Wrong name?</tspan></text></g><g><rect x="620" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="380" r="16" fill="#1e6b68"/><text x="650" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">7</text><text x="676" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Change ONE thing</tspan></text><text x="638" y="440" font-size="17" fill="#3b4744"><tspan x="638" dy="0">Fix it and run again. One</tspan><tspan x="638" dy="22">change at a time.</tspan></text></g><g><rect x="910" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="380" r="16" fill="#1e6b68"/><text x="940" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">8</text><text x="966" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Error gone:</tspan><tspan x="966" dy="26">remember</tspan></text><text x="928" y="466" font-size="17" fill="#3b4744"><tspan x="928" dy="0">Write down what it taught</tspan><tspan x="928" dy="22">you.</tspan></text></g></g><text font-family="sans-serif" font-size="20" fill="#1d2523"><tspan x="40" y="625">The last line tells you what went wrong. The lines above show the path the program walked. Find the line from your own</tspan><tspan x="40" y="653">file, fix one thing, and run again.</tspan></text></svg>
