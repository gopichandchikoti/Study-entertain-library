<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Three ways to see what your system is doing</title><desc id="desc">Logs are a diary, metrics are a scoreboard, and traces are a trip itinerary. A request ID ties them together so you can follow one story from start to end.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2523">Three ways to see what your system is doing</text><g font-family="sans-serif"><path d="M 295 195 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 195 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 195 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 1037.5 295 V 321 H 22 V 450 H 36" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 295 450 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 450 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 450 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="125" r="16" fill="#1e6b68"/><text x="70" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="96" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">A request arrives</tspan></text><text x="58" y="185" font-size="17" fill="#3b4744"><tspan x="58" dy="0">We give it a unique</tspan><tspan x="58" dy="22">request ID, like a name</tspan><tspan x="58" dy="22">tag.</tspan></text></g><g><rect x="330" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="125" r="16" fill="#1e6b68"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="386" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Logs: the diary</tspan></text><text x="348" y="185" font-size="17" fill="#3b4744"><tspan x="348" dy="0">Short notes of what</tspan><tspan x="348" dy="22">happened, each with the</tspan><tspan x="348" dy="22">request ID.</tspan></text></g><g><rect x="620" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="125" r="16" fill="#1e6b68"/><text x="650" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="676" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Metrics: the</tspan><tspan x="676" dy="26">scoreboard</tspan></text><text x="638" y="211" font-size="17" fill="#3b4744"><tspan x="638" dy="0">Counts and timings: how</tspan><tspan x="638" dy="22">many requests, how fast,</tspan><tspan x="638" dy="22">how many errors.</tspan></text></g><g><rect x="910" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="125" r="16" fill="#1e6b68"/><text x="940" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="966" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Traces: the</tspan><tspan x="966" dy="26">itinerary</tspan></text><text x="928" y="211" font-size="17" fill="#3b4744"><tspan x="928" dy="0">Shows which services the</tspan><tspan x="928" dy="22">request visited and how</tspan><tspan x="928" dy="22">long each took.</tspan></text></g><g><rect x="40" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#b34f2e" stroke-width="3"/><circle cx="70" cy="380" r="16" fill="#b34f2e"/><text x="70" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="96" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Something looks</tspan><tspan x="96" dy="26">wrong</tspan></text><text x="58" y="466" font-size="17" fill="#3b4744"><tspan x="58" dy="0">The error count jumps, or</tspan><tspan x="58" dy="22">answers become slow.</tspan></text></g><g><rect x="330" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="380" r="16" fill="#1e6b68"/><text x="360" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="386" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">An alert rings</tspan></text><text x="348" y="440" font-size="17" fill="#3b4744"><tspan x="348" dy="0">The right person is told,</tspan><tspan x="348" dy="22">with a note about what to</tspan><tspan x="348" dy="22">check first.</tspan></text></g><g><rect x="620" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="380" r="16" fill="#1e6b68"/><text x="650" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">7</text><text x="676" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Follow the</tspan><tspan x="676" dy="26">request ID</tspan></text><text x="638" y="466" font-size="17" fill="#3b4744"><tspan x="638" dy="0">Search the logs and trace</tspan><tspan x="638" dy="22">to find exactly where it</tspan><tspan x="638" dy="22">broke.</tspan></text></g><g><rect x="910" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="380" r="16" fill="#1e6b68"/><text x="940" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">8</text><text x="966" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Fix and learn</tspan></text><text x="928" y="440" font-size="17" fill="#3b4744"><tspan x="928" dy="0">Fix it, then write down</tspan><tspan x="928" dy="22">what we learned so it</tspan><tspan x="928" dy="22">does not happen again.</tspan></text></g></g><text font-family="sans-serif" font-size="20" fill="#1d2523"><tspan x="40" y="625">Logs are a diary, metrics are a scoreboard, and traces are a trip itinerary. A request ID ties them together so you can</tspan><tspan x="40" y="653">follow one story from start to end.</tspan></text></svg>
