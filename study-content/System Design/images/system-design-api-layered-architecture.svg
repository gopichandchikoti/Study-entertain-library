<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Layers: a school with different jobs in different rooms</title><desc id="desc">Each layer has one job and only talks to the layer next to it. That way you can change the storage without touching the screens, and the other way around.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2523">Layers: a school with different jobs in different rooms</text><g font-family="sans-serif"><path d="M 295 195 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 195 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 195 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 1037.5 295 V 321 H 22 V 450 H 36" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 295 450 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="125" r="16" fill="#1e6b68"/><text x="70" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="96" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">The screen</tspan><tspan x="96" dy="26">(presentation)</tspan></text><text x="58" y="211" font-size="17" fill="#3b4744"><tspan x="58" dy="0">What people see and tap.</tspan><tspan x="58" dy="22">It does not know how data</tspan><tspan x="58" dy="22">is stored.</tspan></text></g><g><rect x="330" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="125" r="16" fill="#1e6b68"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="386" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">The front desk</tspan><tspan x="386" dy="26">(API)</tspan></text><text x="348" y="211" font-size="17" fill="#3b4744"><tspan x="348" dy="0">Takes requests, checks</tspan><tspan x="348" dy="22">the shape, and sends back</tspan><tspan x="348" dy="22">answers.</tspan></text></g><g><rect x="620" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="125" r="16" fill="#1e6b68"/><text x="650" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="676" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">The rule book</tspan><tspan x="676" dy="26">(application)</tspan></text><text x="638" y="211" font-size="17" fill="#3b4744"><tspan x="638" dy="0">Decides the steps: 'first</tspan><tspan x="638" dy="22">check, then save, then</tspan><tspan x="638" dy="22">tell'.</tspan></text></g><g><rect x="910" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="125" r="16" fill="#1e6b68"/><text x="940" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="966" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">The facts</tspan><tspan x="966" dy="26">(domain)</tspan></text><text x="928" y="211" font-size="17" fill="#3b4744"><tspan x="928" dy="0">The real rules of the</tspan><tspan x="928" dy="22">business, like 'a title</tspan><tspan x="928" dy="22">can't be empty'.</tspan></text></g><g><rect x="40" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="380" r="16" fill="#1e6b68"/><text x="70" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="96" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">The storage</tspan><tspan x="96" dy="26">helper</tspan></text><text x="58" y="466" font-size="17" fill="#3b4744"><tspan x="58" dy="0">Knows how to read and</tspan><tspan x="58" dy="22">write the data, and</tspan><tspan x="58" dy="22">nothing else.</tspan></text></g><g><rect x="330" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="380" r="16" fill="#1e6b68"/><text x="360" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="386" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">The tools</tspan><tspan x="386" dy="26">(infrastructure)</tspan></text><text x="348" y="466" font-size="17" fill="#3b4744"><tspan x="348" dy="0">Database, files, and</tspan><tspan x="348" dy="22">email: the outside things</tspan><tspan x="348" dy="22">we plug in.</tspan></text></g></g><text font-family="sans-serif" font-size="20" fill="#1d2523"><tspan x="40" y="625">Each layer has one job and only talks to the layer next to it. That way you can change the storage without touching the</tspan><tspan x="40" y="653">screens, and the other way around.</tspan></text></svg>
