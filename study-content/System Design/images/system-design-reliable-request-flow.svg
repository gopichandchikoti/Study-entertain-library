<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">When something breaks, don't make it worse</title><desc id="desc">Wait only a little (timeout), try again carefully (retry with waiting), and stop calling a broken helper for a while (circuit breaker). Always tell the user the truth.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2523">When something breaks, don't make it worse</text><g font-family="sans-serif"><path d="M 295 195 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 195 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 195 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 1037.5 295 V 321 H 22 V 450 H 36" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 295 450 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 450 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 450 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="125" r="16" fill="#1e6b68"/><text x="70" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="96" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Call a helper</tspan></text><text x="58" y="185" font-size="17" fill="#3b4744"><tspan x="58" dy="0">Our app asks another</tspan><tspan x="58" dy="22">service for something.</tspan></text></g><g><rect x="330" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="125" r="16" fill="#1e6b68"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="386" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Set a timer</tspan></text><text x="348" y="185" font-size="17" fill="#3b4744"><tspan x="348" dy="0">Only wait a short time.</tspan><tspan x="348" dy="22">Waiting forever blocks</tspan><tspan x="348" dy="22">everyone.</tspan></text></g><g><rect x="620" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#b34f2e" stroke-width="3"/><circle cx="650" cy="125" r="16" fill="#b34f2e"/><text x="650" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="676" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">No answer</tspan></text><text x="638" y="185" font-size="17" fill="#3b4744"><tspan x="638" dy="0">The timer rings. The</tspan><tspan x="638" dy="22">helper is slow or broken.</tspan></text></g><g><rect x="910" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="125" r="16" fill="#1e6b68"/><text x="940" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="966" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Try again, later</tspan></text><text x="928" y="185" font-size="17" fill="#3b4744"><tspan x="928" dy="0">Wait a bit, then wait</tspan><tspan x="928" dy="22">longer next time, with a</tspan><tspan x="928" dy="22">little randomness.</tspan></text></g><g><rect x="40" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#b34f2e" stroke-width="3"/><circle cx="70" cy="380" r="16" fill="#b34f2e"/><text x="70" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="96" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Too many failures</tspan></text><text x="58" y="440" font-size="17" fill="#3b4744"><tspan x="58" dy="0">The circuit breaker</tspan><tspan x="58" dy="22">'trips' and stops sending</tspan><tspan x="58" dy="22">more calls.</tspan></text></g><g><rect x="330" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="380" r="16" fill="#1e6b68"/><text x="360" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="386" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Use a backup plan</tspan></text><text x="348" y="440" font-size="17" fill="#3b4744"><tspan x="348" dy="0">Show a saved copy or a</tspan><tspan x="348" dy="22">clear message instead of</tspan><tspan x="348" dy="22">a crash.</tspan></text></g><g><rect x="620" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="380" r="16" fill="#1e6b68"/><text x="650" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">7</text><text x="676" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Test gently</tspan></text><text x="638" y="440" font-size="17" fill="#3b4744"><tspan x="638" dy="0">After a pause, send one</tspan><tspan x="638" dy="22">test call to see if it</tspan><tspan x="638" dy="22">works again.</tspan></text></g><g><rect x="910" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="380" r="16" fill="#1e6b68"/><text x="940" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">8</text><text x="966" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Back to normal</tspan></text><text x="928" y="440" font-size="17" fill="#3b4744"><tspan x="928" dy="0">The helper answers, and</tspan><tspan x="928" dy="22">the breaker closes.</tspan></text></g></g><text font-family="sans-serif" font-size="20" fill="#1d2523"><tspan x="40" y="625">Wait only a little (timeout), try again carefully (retry with waiting), and stop calling a broken helper for a while</tspan><tspan x="40" y="653">(circuit breaker). Always tell the user the truth.</tspan></text></svg>
