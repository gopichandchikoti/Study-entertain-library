<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">A ticket counter for slow jobs</title><desc id="desc">A slow job gets a ticket and goes into a line. A helper does the work in the background while the visitor goes on with their day. If a job keeps failing, it goes to a special 'problem box' for a person to look at.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2523">A ticket counter for slow jobs</text><g font-family="sans-serif"><path d="M 295 195 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 195 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 195 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 1037.5 295 V 321 H 22 V 450 H 36" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 295 450 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 450 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 450 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="125" r="16" fill="#1e6b68"/><text x="70" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="96" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">A big request</tspan><tspan x="96" dy="26">comes in</tspan></text><text x="58" y="211" font-size="17" fill="#3b4744"><tspan x="58" dy="0">Someone asks for a huge</tspan><tspan x="58" dy="22">PDF report. That takes</tspan><tspan x="58" dy="22">minutes.</tspan></text></g><g><rect x="330" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="125" r="16" fill="#1e6b68"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="386" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Give a ticket</tspan></text><text x="348" y="185" font-size="17" fill="#3b4744"><tspan x="348" dy="0">The app answers quickly:</tspan><tspan x="348" dy="22">'Got it. Your ticket</tspan><tspan x="348" dy="22">number is 42.'</tspan></text></g><g><rect x="620" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="125" r="16" fill="#1e6b68"/><text x="650" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="676" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Put it in the</tspan><tspan x="676" dy="26">line</tspan></text><text x="638" y="211" font-size="17" fill="#3b4744"><tspan x="638" dy="0">The job waits in a queue.</tspan><tspan x="638" dy="22">The line has a size</tspan><tspan x="638" dy="22">limit.</tspan></text></g><g><rect x="910" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="125" r="16" fill="#1e6b68"/><text x="940" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="966" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">A helper picks it</tspan><tspan x="966" dy="26">up</tspan></text><text x="928" y="211" font-size="17" fill="#3b4744"><tspan x="928" dy="0">A worker takes the next</tspan><tspan x="928" dy="22">job when it is free.</tspan></text></g><g><rect x="40" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="380" r="16" fill="#1e6b68"/><text x="70" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="96" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Show progress</tspan></text><text x="58" y="440" font-size="17" fill="#3b4744"><tspan x="58" dy="0">The ticket number lets</tspan><tspan x="58" dy="22">you ask: 'Is it done</tspan><tspan x="58" dy="22">yet?'</tspan></text></g><g><rect x="330" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="380" r="16" fill="#1e6b68"/><text x="360" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="386" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Done: save the</tspan><tspan x="386" dy="26">result</tspan></text><text x="348" y="466" font-size="17" fill="#3b4744"><tspan x="348" dy="0">The finished file is</tspan><tspan x="348" dy="22">saved and the status says</tspan><tspan x="348" dy="22">'done'.</tspan></text></g><g><rect x="620" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#b34f2e" stroke-width="3"/><circle cx="650" cy="380" r="16" fill="#b34f2e"/><text x="650" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">7</text><text x="676" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Failed? Try again</tspan></text><text x="638" y="440" font-size="17" fill="#3b4744"><tspan x="638" dy="0">If it fails, the helper</tspan><tspan x="638" dy="22">waits a bit and tries</tspan><tspan x="638" dy="22">again a few times.</tspan></text></g><g><rect x="910" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#b34f2e" stroke-width="3"/><circle cx="940" cy="380" r="16" fill="#b34f2e"/><text x="940" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">8</text><text x="966" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">The problem box</tspan></text><text x="928" y="440" font-size="17" fill="#3b4744"><tspan x="928" dy="0">After too many failures</tspan><tspan x="928" dy="22">the job goes to a</tspan><tspan x="928" dy="22">dead-letter box for a</tspan><tspan x="928" dy="22">human.</tspan></text></g></g><text font-family="sans-serif" font-size="20" fill="#1d2523"><tspan x="40" y="625">A slow job gets a ticket and goes into a line. A helper does the work in the background while the visitor goes on with</tspan><tspan x="40" y="653">their day. If a job keeps failing, it goes to a special 'problem box' for a person to look at.</tspan></text></svg>
