<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">A cache is a sticky note on your desk</title><desc id="desc">Look at the sticky note first (cache). If the answer is there, great. If not, go to the big storeroom, copy the answer onto a sticky note, and keep going. When facts change, throw the old note away.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2523">A cache is a sticky note on your desk</text><g font-family="sans-serif"><path d="M 295 195 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 195 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 195 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 1037.5 295 V 321 H 22 V 450 H 36" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 295 450 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 450 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 450 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="125" r="16" fill="#1e6b68"/><text x="70" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="96" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Someone asks</tspan></text><text x="58" y="185" font-size="17" fill="#3b4744"><tspan x="58" dy="0">A visitor wants a note.</tspan><tspan x="58" dy="22">We check the sticky notes</tspan><tspan x="58" dy="22">first.</tspan></text></g><g><rect x="330" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="125" r="16" fill="#1e6b68"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="386" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Cache hit!</tspan></text><text x="348" y="185" font-size="17" fill="#3b4744"><tspan x="348" dy="0">The answer is on the</tspan><tspan x="348" dy="22">sticky note. We reply</tspan><tspan x="348" dy="22">instantly.</tspan></text></g><g><rect x="620" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#b34f2e" stroke-width="3"/><circle cx="650" cy="125" r="16" fill="#b34f2e"/><text x="650" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="676" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Cache miss</tspan></text><text x="638" y="185" font-size="17" fill="#3b4744"><tspan x="638" dy="0">No sticky note yet, so we</tspan><tspan x="638" dy="22">must go and look in the</tspan><tspan x="638" dy="22">storeroom.</tspan></text></g><g><rect x="910" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="125" r="16" fill="#1e6b68"/><text x="940" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="966" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Ask the database</tspan></text><text x="928" y="185" font-size="17" fill="#3b4744"><tspan x="928" dy="0">The database finds the</tspan><tspan x="928" dy="22">real answer. It is</tspan><tspan x="928" dy="22">slower, but always right.</tspan></text></g><g><rect x="40" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="380" r="16" fill="#1e6b68"/><text x="70" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="96" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Write a sticky</tspan><tspan x="96" dy="26">note</tspan></text><text x="58" y="466" font-size="17" fill="#3b4744"><tspan x="58" dy="0">We copy the answer into</tspan><tspan x="58" dy="22">the cache so the next</tspan><tspan x="58" dy="22">person is faster.</tspan></text></g><g><rect x="330" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="380" r="16" fill="#1e6b68"/><text x="360" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="386" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Reply to the</tspan><tspan x="386" dy="26">visitor</tspan></text><text x="348" y="466" font-size="17" fill="#3b4744"><tspan x="348" dy="0">The visitor gets the</tspan><tspan x="348" dy="22">answer.</tspan></text></g><g><rect x="620" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#b34f2e" stroke-width="3"/><circle cx="650" cy="380" r="16" fill="#b34f2e"/><text x="650" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">7</text><text x="676" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">The note changes</tspan></text><text x="638" y="440" font-size="17" fill="#3b4744"><tspan x="638" dy="0">Someone edits the note.</tspan><tspan x="638" dy="22">The old sticky note is</tspan><tspan x="638" dy="22">now wrong.</tspan></text></g><g><rect x="910" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="380" r="16" fill="#1e6b68"/><text x="940" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">8</text><text x="966" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Throw away the</tspan><tspan x="966" dy="26">old copy</tspan></text><text x="928" y="466" font-size="17" fill="#3b4744"><tspan x="928" dy="0">We remove the old cache</tspan><tspan x="928" dy="22">entry so nobody sees</tspan><tspan x="928" dy="22">outdated words.</tspan></text></g></g><text font-family="sans-serif" font-size="20" fill="#1d2523"><tspan x="40" y="625">Look at the sticky note first (cache). If the answer is there, great. If not, go to the big storeroom, copy the answer</tspan><tspan x="40" y="653">onto a sticky note, and keep going. When facts change, throw the old note away.</tspan></text></svg>
