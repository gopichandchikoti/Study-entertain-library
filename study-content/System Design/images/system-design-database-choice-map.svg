<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Which kind of storage should I pick?</title><desc id="desc">Ask what the data looks like and how you will look for it. If you are unsure, start with a normal relational database. It handles most things well.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2523">Which kind of storage should I pick?</text><g font-family="sans-serif"><path d="M 295 195 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 195 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 195 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 1037.5 295 V 321 H 22 V 450 H 36" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 295 450 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 450 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 450 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="125" r="16" fill="#1e6b68"/><text x="70" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="96" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Look at your data</tspan></text><text x="58" y="185" font-size="17" fill="#3b4744"><tspan x="58" dy="0">Is it tidy rows, a bag of</tspan><tspan x="58" dy="22">notes, small facts,</tspan><tspan x="58" dy="22">files, or text to search?</tspan></text></g><g><rect x="330" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="125" r="16" fill="#1e6b68"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="386" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Tidy rows that</tspan><tspan x="386" dy="26">connect</tspan></text><text x="348" y="211" font-size="17" fill="#3b4744"><tspan x="348" dy="0">Use a relational database</tspan><tspan x="348" dy="22">(like PostgreSQL). Great</tspan><tspan x="348" dy="22">for most apps.</tspan></text></g><g><rect x="620" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="125" r="16" fill="#1e6b68"/><text x="650" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="676" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">One fast lookup</tspan></text><text x="638" y="185" font-size="17" fill="#3b4744"><tspan x="638" dy="0">Use a key-value store:</tspan><tspan x="638" dy="22">give a key, get a value,</tspan><tspan x="638" dy="22">very quickly.</tspan></text></g><g><rect x="910" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="125" r="16" fill="#1e6b68"/><text x="940" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="966" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Flexible</tspan><tspan x="966" dy="26">documents</tspan></text><text x="928" y="211" font-size="17" fill="#3b4744"><tspan x="928" dy="0">Use a document database</tspan><tspan x="928" dy="22">when each item has a</tspan><tspan x="928" dy="22">different shape.</tspan></text></g><g><rect x="40" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="380" r="16" fill="#1e6b68"/><text x="70" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="96" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Searching words</tspan></text><text x="58" y="440" font-size="17" fill="#3b4744"><tspan x="58" dy="0">Use a search engine when</tspan><tspan x="58" dy="22">people type words to find</tspan><tspan x="58" dy="22">things.</tspan></text></g><g><rect x="330" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="360" cy="380" r="16" fill="#1e6b68"/><text x="360" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="386" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Big files</tspan></text><text x="348" y="440" font-size="17" fill="#3b4744"><tspan x="348" dy="0">Photos and videos go into</tspan><tspan x="348" dy="22">object storage, with a</tspan><tspan x="348" dy="22">pointer in the database.</tspan></text></g><g><rect x="620" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="380" r="16" fill="#1e6b68"/><text x="650" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">7</text><text x="676" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Check the rules</tspan></text><text x="638" y="440" font-size="17" fill="#3b4744"><tspan x="638" dy="0">Do you need 'all or</tspan><tspan x="638" dy="22">nothing' saves? That</tspan><tspan x="638" dy="22">points to relational.</tspan></text></g><g><rect x="910" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="380" r="16" fill="#1e6b68"/><text x="940" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">8</text><text x="966" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Start simple</tspan></text><text x="928" y="440" font-size="17" fill="#3b4744"><tspan x="928" dy="0">Add another storage only</tspan><tspan x="928" dy="22">when a real need appears.</tspan></text></g></g><text font-family="sans-serif" font-size="20" fill="#1d2523"><tspan x="40" y="625">Ask what the data looks like and how you will look for it. If you are unsure, start with a normal relational database.</tspan><tspan x="40" y="653">It handles most things well.</tspan></text></svg>
