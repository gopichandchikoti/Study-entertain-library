<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">When the line between copies breaks</title><desc id="desc">If two copies cannot talk, we must pick: stay correct and say 'wait', or keep answering and fix differences later. Pick by feature: money must be exact, likes can be a little old.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e6b68"/></marker></defs><rect width="1200" height="700" fill="#f4f0e7"/><text x="40" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2523">When the line between copies breaks</text><g font-family="sans-serif"><path d="M 295 195 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 195 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 195 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 1037.5 295 V 321 H 22 V 450 H 36" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 295 450 H 326" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 585 450 H 616" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M 875 450 H 906" stroke="#1e6b68" stroke-width="3" marker-end="url(#arrow)" fill="none"/><g><rect x="40" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="125" r="16" fill="#1e6b68"/><text x="70" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="96" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Two copies of the</tspan><tspan x="96" dy="26">data</tspan></text><text x="58" y="211" font-size="17" fill="#3b4744"><tspan x="58" dy="0">Ana's notepad and Ben's</tspan><tspan x="58" dy="22">notepad are kept the same</tspan><tspan x="58" dy="22">by talking.</tspan></text></g><g><rect x="330" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#b34f2e" stroke-width="3"/><circle cx="360" cy="125" r="16" fill="#b34f2e"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="386" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">The line breaks</tspan></text><text x="348" y="185" font-size="17" fill="#3b4744"><tspan x="348" dy="0">They cannot talk for a</tspan><tspan x="348" dy="22">while. This is a</tspan><tspan x="348" dy="22">partition.</tspan></text></g><g><rect x="620" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="125" r="16" fill="#1e6b68"/><text x="650" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="676" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Someone asks Ana</tspan></text><text x="638" y="185" font-size="17" fill="#3b4744"><tspan x="638" dy="0">'What is the score?' She</tspan><tspan x="638" dy="22">cannot check with Ben.</tspan></text></g><g><rect x="910" y="95" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="125" r="16" fill="#1e6b68"/><text x="940" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="966" y="131" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">Choice A: be</tspan><tspan x="966" dy="26">correct</tspan></text><text x="928" y="211" font-size="17" fill="#3b4744"><tspan x="928" dy="0">'Please wait until I can</tspan><tspan x="928" dy="22">confirm.' Safe, but no</tspan><tspan x="928" dy="22">answer now.</tspan></text></g><g><rect x="40" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="70" cy="380" r="16" fill="#1e6b68"/><text x="70" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="96" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="96" dy="0">Choice B: always</tspan><tspan x="96" dy="26">answer</tspan></text><text x="58" y="466" font-size="17" fill="#3b4744"><tspan x="58" dy="0">'Last I knew it was 10.'</tspan><tspan x="58" dy="22">Quick, but maybe old.</tspan></text></g><g><rect x="330" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#b34f2e" stroke-width="3"/><circle cx="360" cy="380" r="16" fill="#b34f2e"/><text x="360" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text><text x="386" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="386" dy="0">Money or tickets?</tspan></text><text x="348" y="440" font-size="17" fill="#3b4744"><tspan x="348" dy="0">Choose A. A wrong answer</tspan><tspan x="348" dy="22">here costs real money.</tspan></text></g><g><rect x="620" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="650" cy="380" r="16" fill="#1e6b68"/><text x="650" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">7</text><text x="676" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="676" dy="0">Likes or views?</tspan></text><text x="638" y="440" font-size="17" fill="#3b4744"><tspan x="638" dy="0">Choose B. A number that</tspan><tspan x="638" dy="22">is a little old does no</tspan><tspan x="638" dy="22">harm.</tspan></text></g><g><rect x="910" y="350" width="255" height="200" rx="14" fill="#fffdf8" stroke="#1e6b68" stroke-width="3"/><circle cx="940" cy="380" r="16" fill="#1e6b68"/><text x="940" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">8</text><text x="966" y="386" font-size="22" font-weight="700" fill="#1d2523"><tspan x="966" dy="0">The line returns</tspan></text><text x="928" y="440" font-size="17" fill="#3b4744"><tspan x="928" dy="0">The copies compare notes</tspan><tspan x="928" dy="22">and fix any conflicts.</tspan></text></g></g><text font-family="sans-serif" font-size="20" fill="#1d2523"><tspan x="40" y="625">If two copies cannot talk, we must pick: stay correct and say 'wait', or keep answering and fix differences later. Pick</tspan><tspan x="40" y="653">by feature: money must be exact, likes can be a little old.</tspan></text></svg>
